apiVersion: v1
kind: Service
metadata:
  name: valkey-vm
  namespace: mumnk8s
spec:
  selector:
    kubevirt.io/domain: valkey-vm
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-vm
  namespace: mumnk8s
spec:
  type: LoadBalancer
  selector:
    kubevirt.io/domain: grafana-vm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
